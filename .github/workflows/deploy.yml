# 双仓 + Cloudflare Pages（Deploy Hook）模式：
# 构建在 Cloudflare 侧完成（需配置 CONTENT_REPO_URL 等环境变量）。
# 本 workflow 只负责 POST 部署钩子，不向 GitHub Pages 推送。
name: Deploy Shirone Blog

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trigger-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_DEPLOY_HOOK:-}" ]; then
            echo "未配置 CLOUDFLARE_DEPLOY_HOOK。请在主题仓 Settings → Secrets and variables → Actions 中添加。" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --max-time 30 --request POST "$CLOUDFLARE_DEPLOY_HOOK"
